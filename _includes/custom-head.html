<link rel="icon" type="image/png" href="{{ "/assets/favicon.png" | relative_url }}">
<style>
/* An app page's store row: the badge, and under it one line for a second
   store. Every app page carries the line whether or not it has anything to
   say in it, so the pages stay aligned with each other. */
.store-row { text-align: center; margin: 1rem 0 0; }
.store-row img { height: 40px; width: auto; }
.store-note {
  text-align: center;
  min-height: 1.3em;
  margin: 0.4rem 0 1.25rem;
  font-size: 0.85rem;
  font-style: italic;
  color: #888;
}
/* "Water Polo" nav dropdown (details/summary, no JS). Desktop: floating
   menu under the trigger. Phone (minima hamburger, <=600px): inline group. */
.nav-dropdown { position: relative; display: inline-block; }
.nav-dropdown > summary {
  cursor: pointer;
  list-style: none;
  display: inline-block;
}
.nav-dropdown > summary::-webkit-details-marker { display: none; }
.nav-dropdown > summary::after { content: " \25BE"; font-size: 0.8em; }
.nav-dropdown-menu {
  position: absolute;
  left: 0;
  top: 100%;
  margin-top: 6px;
  background: #fdfdfd;
  border: 1px solid #e8e8e8;
  border-radius: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  padding: 8px 14px;
  min-width: 12rem;
  z-index: 10;
  text-align: left;
}
.nav-dropdown-menu .page-link {
  display: block;
  margin: 6px 0;
  white-space: nowrap;
}
@media screen and (max-width: 600px) {
  .nav-dropdown { display: block; }
  .nav-dropdown-menu {
    position: static;
    border: none;
    box-shadow: none;
    background: transparent;
    padding: 0 0 0 14px;
    margin-top: 0;
    min-width: 0;
  }
}
</style>
